<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رمز التحقق الخاص بك | QAVEN</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f5f7; -webkit-text-size-adjust:100%;">
    <!-- شعار QAVEN نصي — لا يعتمد على أي رابط خارجي (الأصول المحلية غير مستضافة بعد على HTTPS عام) -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px; background-color:#ffffff; border:1px solid #e4e4e7; border-radius:12px;">
            <tr>
              <td style="padding:40px 40px 8px; text-align:center;">
                <p style="margin:0 0 18px; font-family:Tahoma,Arial,sans-serif; font-size:18px; font-weight:700; letter-spacing:8px; color:#0b0b0d;">QAVEN</p>
                <h1 style="margin:0; font-family:Tahoma,Arial,sans-serif; font-size:19px; font-weight:700; color:#0b0b0d;">رمز التحقق الخاص بك</h1>
                <p style="margin:12px 0 0; font-family:Tahoma,Arial,sans-serif; font-size:14px; line-height:1.8; color:#3f3f46;">
                  استخدم رمز التحقق التالي لإكمال تسجيل الدخول إلى حسابك في QAVEN.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 40px;">
                <div style="font-family:Tahoma,Arial,sans-serif; font-size:36px; font-weight:700; letter-spacing:10px; color:#0b0b0d; background-color:#f4f5f7; border-radius:10px; padding:18px 12px;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 20px; text-align:center;">
                <p style="margin:0; font-family:Tahoma,Arial,sans-serif; font-size:13px; line-height:1.8; color:#71717a;">أدخل الرمز في صفحة QAVEN خلال 10 دقائق من استلام هذه الرسالة.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 40px 36px;">
                <div style="border-top:1px solid #e4e4e7; padding-top:16px; text-align:center;">
                  <p style="margin:0; font-family:Tahoma,Arial,sans-serif; font-size:11px; line-height:1.8; color:#71717a;">
                    إذا لم تطلب هذا الرمز، يمكنك تجاهل هذه الرسالة.
                  </p>
                </div>
                <p style="margin:16px 0 0; text-align:center; font-family:Tahoma,Arial,sans-serif; font-size:11px; color:#a1a1aa;">
                  QAVEN — متجر الإلكترونيات والأجهزة الذكية · سلطنة عُمان
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
